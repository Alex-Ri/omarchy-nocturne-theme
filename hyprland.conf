# Nocturne Hyprland look-and-feel.
# This file is not a full hyprland configuration. It is intended to be
# included in your main hyprland.conf (or sourced via hyprland.lua) when you
# install the theme from a git repo, where .lua files are dropped for safety.

general {
    col.active_border = rgba(5e81acee)
    col.inactive_border = rgba(262626ee)
    border_size = 2
    gaps_in = 3
    gaps_out = 5
}

decoration {
    rounding = 8
    active_opacity = 0.97
    inactive_opacity = 0.93
    fullscreen_opacity = 1.0
}
