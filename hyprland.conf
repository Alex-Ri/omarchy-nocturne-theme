# Nocturne Hyprland look-and-feel.
# This file is not a full hyprland configuration. It is intended to be
# included in your main hyprland.conf (or sourced via hyprland.lua) when you
# install the theme from a git repo, where .lua files are dropped for safety.
#
# Source it after installing, e.g. append to ~/.config/hypr/hyprland.lua:
#   dofile(os.getenv("XDG_CONFIG_HOME") .. "/hypr/../omarchy-nocturne.conf")

general {
    col.active_border = rgba(a8b0c0ee)
    col.inactive_border = rgba(262626ee)
    border_size = 1
    gaps_in = 3
    gaps_out = 5
}

decoration {
    rounding = 6
    active_opacity = 0.94
    inactive_opacity = 0.90
    fullscreen_opacity = 1.0

    shadow {
        enabled = false
    }

    blur {
        enabled = true
        size = 6
        passes = 3
        noise = 0.02
        contrast = 1.0
        brightness = 1.0
        vibrancy = 0.25
        vibrancy_darkness = 0.2
        ignore_opacity = true
        new_optimizations = true
        xray = false
    }
}

# Frosted-glass layer rules: blur what shows through the translucent shell
# surfaces (bar, launcher/menus, notifications, popouts).
layerrule = blur, namespace:omarchy-bar, ignorealpha 0
layerrule = blur, namespace:^(omarchy-menu|omarchy-image-selector|omarchy-emojis|omarchy-clipboard|omarchy-keyboard-panel|omarchy-notifications)$, ignorealpha 0

# Frosted-glass terminal windows: translucent + blurred backdrop. (Global blur
# applies to any window rendered below opacity 1; no separate rule needed.)
windowrule = opacity 0.92 0.88, class:^(foot|Alacritty|kitty|com.mitchellh.ghostty)$

# Frosted-glass apps: browsers and web PWAs like WhatsApp.
windowrule = opacity 0.95 0.9, class:^(zen|google-chrome|chromium|brave|firefox|Zen)$
windowrule = opacity 0.95 0.9, class:^chrome-web\.whatsapp\.com__-Default$

animations {
    enabled = true
    bezier = easeOut, 0.25, 0.46, 0.45, 0.94
    bezier = easeInOut, 0.8, 0, 0.2, 1

    animation = windows, 1, 3.0, easeOut
    animation = windowsIn, 1, 2.8, easeOut
    animation = windowsOut, 1, 2.6, easeInOut
    animation = windowsMove, 1, 3.0, easeOut
    animation = fade, 1, 2.4, easeInOut
    animation = border, 1, 3.0, easeOut
    animation = borderangle, 1, 3.0, easeOut
    animation = workspaces, 1, 3.4, easeOut, fade
}